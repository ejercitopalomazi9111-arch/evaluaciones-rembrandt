# Publica el sitio en GitHub Pages.
#
# Pages sólo sirve archivos estáticos, así que se compila con
# `EXPORT_ESTATICO=1` (ver `next.config.ts`): sin optimización de imágenes al
# vuelo, sin cabeceras desde Next y con el formulario en su camino de respaldo
# —correo, WhatsApp, llamada— porque no hay servidor que mande nada.
#
# ## Por qué se publica empujando a `gh-pages` y no con `deploy-pages`
#
# El camino moderno (`actions/configure-pages` + `actions/deploy-pages`) exige
# que el sitio de Pages ya exista, y darlo de alta requiere permisos de
# administrador que el token de Actions no tiene: GitHub responde "Resource not
# accessible by integration". Empujar a una rama `gh-pages` sí está permitido
# con `contents: write`, y GitHub publica esa rama sin que nadie toque Settings.
name: Publicar el sitio

on:
  push:
    branches:
      - master
    # El propio workflow committea `sitio.html`. Sin ignorarlo, ese commit
    # dispararía otra ejecución y así indefinidamente.
    paths-ignore:
      - 'sitio.html'
  workflow_dispatch:

permissions:
  contents: write

# Una publicación a la vez, sin cancelar la que ya esté corriendo: cancelar a
# medias puede dejar el sitio servido a medio actualizar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # El sitio no cuelga de la raíz del dominio sino de /<repo>/, así que hay
      # que declararlo o todos los enlaces y assets apuntan a un sitio que no
      # existe. Se deduce del nombre del repositorio para que un renombrado no
      # obligue a tocar nada.
      - name: Compilar el export estático
        env:
          EXPORT_ESTATICO: '1'
          RUTA_BASE: /${{ github.event.repository.name }}
          NEXT_PUBLIC_RUTA_BASE: /${{ github.event.repository.name }}
          # De aquí salen el canonical, el sitemap y las tarjetas de Open Graph.
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      # Sin este archivo, Jekyll se traga todo lo que empieza por guion bajo y
      # el sitio se queda sin `_next/`: ni estilos ni JavaScript.
      - run: touch out/.nojekyll

      - name: Empujar a gh-pages
        run: |
          cd out
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${{ github.sha }}"
          # La rama es un espejo del build, no un historial: se reescribe entera
          # en cada publicación para que no crezca sin límite.
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages

  # `sitio.html` es el sitio entero —las 13 rutas, con navegación— en un solo
  # archivo con todo incrustado: cero peticiones externas. Sirve para abrirlo
  # desde cualquier visor de HTML crudo de GitHub sin montar infraestructura, y
  # para mandarlo por correo o WhatsApp. Se regenera aquí para que no envejezca.
  empaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Empaquetar en un solo archivo
        run: |
          npx next start -p 3310 &
          until curl -sf -o /dev/null http://localhost:3310/; do sleep 2; done
          node scripts/empaquetar-una-pagina.mjs
          cp sitio-una-pagina.html sitio.html

      - name: Committear el archivo único
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitio.html
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -q -m "chore: regenerar sitio.html"
          for intento in 1 2 3; do
            git fetch origin master
            git rebase origin/master || exit 1
            git push origin HEAD:master && exit 0
            sleep $((intento * 5))
          done
          exit 1
